name: Release Mio Player APK (OTA)
# OTA: push a tag like v1.0.1 and this creates a GitHub Release with the
# APK attached. The app's OTA checker reads releases/latest and offers
# the .apk to installed users. No Play Store needed.
#
# The attached file is the DEBUG APK, renamed Mio_Player-<tag>.apk
# (e.g. Mio_Player-v1.0.0.apk). Reason: the release APK is unsigned
# (no signingConfig / keystore in the project), so Android refuses to
# install it. The debug APK is signed with the debug key and installs
# fine, and OTA from a debug install to a debug-signed release works
# because the signature matches. This is OTA option A (2026-11-20).
"on":
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build debug APK (signed with debug key, for OTA)
        run: gradle assembleDebug --stacktrace
      - name: Rename APK to Mio_Player-<tag>.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "Mio_Player-${{ github.ref_name }}.apk"
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: Mio_Player-${{ github.ref_name }}.apk
          generate_release_notes: true
