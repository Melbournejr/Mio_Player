name: Build Mio Player APK
"on":
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      # FIX 2026-11-20: android-actions/setup-android@v3 failed because it
      # runs `sdkmanager --licenses` interactively and prompts
      # "Review licenses that have not been accepted (y/N)?" with no stdin.
      # ubuntu-latest already ships a full Android SDK, so use it directly
      # and accept licenses non-interactively with `yes |`.
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ -z "$ANDROID_SDK_ROOT" ]; then echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV; fi
          if [ -z "$ANDROID_HOME" ]; then echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV; fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          ls "$SDK/cmdline-tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      # NOTE: this repo ships a gradlew launcher, but not the binary
      # gradle-wrapper.jar (generated by `gradle wrapper`). Using the
      # system Gradle installed above is the reliable path on CI.
      # Locally, run `gradle wrapper --gradle-version 8.7` once to
      # generate the wrapper jar, then ./gradlew works too.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK (unsigned)
        run: gradle assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with: { name: mio-player-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with: { name: mio-player-release-apk, path: app/build/outputs/apk/release/app-release-unsigned.apk, if-no-files-found: warn }
