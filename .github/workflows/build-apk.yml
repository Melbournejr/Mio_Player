name: Build Mio Player APK
"on":
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      # NOTE: this repo ships a gradlew launcher, but not the binary
      # gradle-wrapper.jar (generated by `gradle wrapper`). Using the
      # system Gradle installed above is the reliable path on CI.
      # Locally, run `gradle wrapper --gradle-version 8.7` once to
      # generate the wrapper jar, then ./gradlew works too.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK (unsigned)
        run: gradle assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with: { name: mio-player-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with: { name: mio-player-release-apk, path: app/build/outputs/apk/release/app-release-unsigned.apk, if-no-files-found: warn }
